# Conda environment for local GrapeAncestry suite runs.
# Streamlit Community Cloud (no aligner / caller binaries).
# Local lab: conda env create -f environment-hpc.yml
name: grapeancestry-cloud
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - setuptools
  - numpy
  - pandas
  - scipy
  - matplotlib
  - pip:
      - streamlit>=1.30
      - click>=8.1
      - pyyaml>=6.0
      - jinja2>=3.1
      - openpyxl>=3.1
