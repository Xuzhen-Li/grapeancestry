[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grapeancestry"
version = "0.1.0"
description = "GrapeAncestry v1.0.0 — grapevine 167K capture companion (Docker UI + report)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "GrapeAncestry Suite" }]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "scipy>=1.10",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
web = ["streamlit>=1.30"]

[project.scripts]
grapeancestry = "grapeancestry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: real 167k GWAS (minutes)",
]
